name: Pruebas de CICSA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: node tests/run_js_tests.js
      - run: node tests/security_sync_tests.js
      - run: node --test tests/ingredients.test.cjs
      - run: node --test tests/financial_access.test.cjs
      - run: node --test tests/app_icons.test.cjs
      - run: node --test tests/gastos_layout.test.cjs
      - run: node --test tests/capture_context.test.cjs
      - run: python -m unittest discover -s tests -p 'test*.py'
      # Proceso separado: las pruebas heredadas de Gmail sustituyen módulos de Google.
      - run: python tests/backend_authorization_checks.py
  firebase_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix tests/firebase ci --ignore-scripts --no-fund --no-audit
      - run: npm --prefix tests/firebase run test:rules
